<!-- Micro-Interactions Script (Password reveal & Bilingual Direction toggle) -->
<script>
    // Password toggle
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password-input');
    const eyeIcon = document.getElementById('eye-icon');

    if (togglePasswordBtn && passwordInput && eyeIcon) {
      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        eyeIcon.setAttribute('data-icon', isPassword ? 'visibility_off' : 'visibility');
      });
    }

    // Bilingual RTL / LTR toggle demonstration
    const langToggleBtn = document.getElementById('lang-toggle');
    const htmlRoot = document.documentElement;

    if (langToggleBtn) {
      langToggleBtn.addEventListener('click', () => {
        const isRtl = htmlRoot.getAttribute('dir') === 'rtl';
        if (isRtl) {
          htmlRoot.setAttribute('dir', 'ltr');
          htmlRoot.setAttribute('lang', 'en');
          langToggleBtn.querySelector('span:first-child').textContent = 'AR';
          langToggleBtn.querySelector('span:last-child').textContent = 'العربية';
        } else {
          htmlRoot.setAttribute('dir', 'rtl');
          htmlRoot.setAttribute('lang', 'ar');
          langToggleBtn.querySelector('span:first-child').textContent = 'EN';
          langToggleBtn.querySelector('span:last-child').textContent = 'English';
        }
      });
    }
  </script>
