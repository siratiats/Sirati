<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Siratie - Sign In</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
          },
          colors: {
            cream: '#F8F5F0',
            petrol: '#0F3D50',
            teal: {
              DEFAULT: '#00806F',
              hover: '#0A6C5E',
              gradient: '#0F8A7A',
            },
          }
        }
      }
    }
  </script>
  <style>
    * {
      font-family: 'IBM Plex Sans Arabic', sans-serif !important;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #F8F5F0;
      color: #1E293B;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* Subtle grid pattern overlay with fade out */
    .hero-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.09) 1px, transparent 1px);
      background-size: 24px 24px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    }
  </style>
</head>
<body class="bg-[#F8F5F0] flex flex-col justify-start items-center min-h-screen">
  <main class="w-full max-w-[420px] min-h-screen flex flex-col relative pb-8">
    
    <!-- HERO SECTION (~36% height) -->
    <header class="relative w-full h-[320px] bg-gradient-to-br from-[#0F3D50] to-[#0F8A7A] rounded-b-[40px] px-6 pt-5 pb-10 flex flex-col items-center shadow-lg overflow-hidden flex-shrink-0">
      <!-- Grid overlay -->
      <div class="absolute inset-0 hero-grid pointer-events-none"></div>

      <!-- Top bar (Only Language Pill on top-right, no top-left logo) -->
      <div class="w-full flex justify-end items-center z-10">
        <button type="button" aria-label="Switch Language" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 hover:bg-white/25 active:bg-white/30 backdrop-blur-md border border-white/20 text-white text-xs font-medium tracking-wide transition-all shadow-sm">
          <span>AR</span>
          <span class="opacity-40">|</span>
          <span class="font-normal">العربية</span>
        </button>
      </div>

      <!-- Center Content: Logo & Titles -->
      <div class="relative z-10 flex flex-col items-center text-center mt-2">
        <!-- Frosted white glass tile enclosing app logo -->
        <div class="p-2.5 rounded-[22px] bg-white/15 backdrop-blur-md border border-white/25 shadow-xl mb-3 flex items-center justify-center">
          <div class="w-14 h-14 rounded-[16px] bg-gradient-to-br from-[#0F3D50] to-[#0F8A7A] flex items-center justify-center shadow-md">
            <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          </div>
        </div>

        <h1 class="text-white font-bold text-[26px] leading-tight tracking-tight drop-shadow-sm">
          Welcome to Siratie
        </h1>
        <p class="text-white/80 text-sm mt-1 font-normal">
          Sign in to continue
        </p>
      </div>
    </header>

    <!-- FORM CARD (White card, 24px radius, overlapping hero by ~28px) -->
    <div class="relative z-20 px-5 -mt-7 w-full">
      <section class="bg-white rounded-[24px] shadow-[0_10px_35px_-8px_rgba(15,61,80,0.12),0_4px_12px_rgba(0,0,0,0.04)] border border-slate-100/90 p-6 sm:p-7">
        <form onsubmit="event.preventDefault();" class="space-y-4">
          
          <!-- Email Field -->
          <div class="space-y-1.5">
            <label for="email" class="block text-xs font-semibold text-slate-700 tracking-wide">
              Email
            </label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                <!-- Mail Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
              </span>
              <input 
                id="email" 
                type="email" 
                placeholder="name@example.com" 
                class="w-full pl-11 pr-4 py-3 bg-[#FBFBFC] hover:bg-slate-50 focus:bg-white text-slate-900 text-sm rounded-xl border border-slate-200 focus:border-[#00806F] focus:ring-2 focus:ring-[#00806F]/15 outline-none transition-all placeholder:text-slate-400"
                required
              />
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-1.5">
            <label for="password" class="block text-xs font-semibold text-slate-700 tracking-wide">
              Password
            </label>
            <div class="relative flex items-center">
              <span class="absolute left-3.5 text-slate-400 pointer-events-none flex items-center">
                <!-- Lock Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
              </span>
              <input 
                id="password" 
                type="password" 
                placeholder="••••••••" 
                class="w-full pl-11 pr-11 py-3 bg-[#FBFBFC] hover:bg-slate-50 focus:bg-white text-slate-900 text-sm rounded-xl border border-slate-200 focus:border-[#00806F] focus:ring-2 focus:ring-[#00806F]/15 outline-none transition-all placeholder:text-slate-400"
                required
              />
              <button 
                type="button" 
                id="togglePassword"
                aria-label="Toggle password visibility" 
                class="absolute right-3.5 text-slate-400 hover:text-slate-600 focus:outline-none p-0.5 rounded transition-colors"
                onclick="const pwd = document.getElementById('password'); const isPwd = pwd.type === 'password'; pwd.type = isPwd ? 'text' : 'password';"
              >
                <!-- Eye Icon -->
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Forgot Password Link -->
          <div class="flex justify-end pt-0.5">
            <a href="#" class="text-xs font-semibold text-[#00806F] hover:text-[#0A6C5E] hover:underline focus:outline-none transition-colors">
              Forgot password?
            </a>
          </div>

          <!-- Primary Submit Button -->
          <button 
            type="submit" 
            class="w-full py-3.5 px-5 bg-[#00806F] hover:bg-[#0A6C5E] active:scale-[0.99] text-white font-medium text-sm rounded-[16px] shadow-sm hover:shadow transition-all flex items-center justify-center gap-2 mt-2 focus:outline-none focus:ring-2 focus:ring-[#00806F] focus:ring-offset-2"
          >
            <span>Sign in</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
            </svg>
          </button>
        </form>

        <!-- Divider -->
        <div class="relative my-6 flex items-center justify-center">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-slate-200"></div>
          </div>
          <span class="relative px-3 bg-white text-[11px] font-medium tracking-wider text-slate-400 uppercase">
            OR CONTINUE WITH
          </span>
        </div>

        <!-- Social Logins (Equal 16px radius outlined buttons side by side) -->
        <div class="grid grid-cols-2 gap-3">
          <!-- Google Button -->
          <button 
            type="button" 
            class="flex items-center justify-center gap-2 py-3 px-3 bg-white hover:bg-slate-50 active:bg-slate-100 rounded-[16px] border border-slate-200 text-xs font-medium text-slate-700 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-slate-200"
          >
            <!-- Google Multicolor G -->
            <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.65v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.14z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.27 21.36 7.34 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.97 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.27 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Google</span>
          </button>

          <!-- Apple Button -->
          <button 
            type="button" 
            class="flex items-center justify-center gap-2 py-3 px-3 bg-white hover:bg-slate-50 active:bg-slate-100 rounded-[16px] border border-slate-200 text-xs font-medium text-slate-700 shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-slate-200"
          >
            <!-- Apple Logo -->
            <svg class="w-4 h-4 flex-shrink-0 fill-current text-slate-900" viewBox="0 0 170 170">
              <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.7-3.04-7.6-7.79-11.71-14.24-5.74-9.03-10.22-19.3-13.43-30.82-3.21-11.51-4.82-22.39-4.82-32.62 0-14.04 3.49-25.7 10.46-34.99 6.98-9.29 15.66-14.02 26.04-14.19 4.93 0 10.3 1.34 16.12 4.02 5.82 2.68 9.69 4.08 11.61 4.2 1.62-.12 5.64-1.57 12.06-4.35 6.42-2.78 11.83-4.06 16.24-3.84 12.02.63 21.75 5.24 29.19 13.84-10.45 6.32-15.54 15.17-15.26 26.54.28 9.04 3.73 16.63 10.36 22.77 6.63 6.14 14.51 9.77 23.63 10.89-2.01 6.15-4.58 12.44-7.73 18.89zM119.22 33.32c0-7.05 2.54-13.62 7.62-19.71 5.08-6.09 11.39-10.15 18.93-12.18.39 1.45.58 2.87.58 4.25 0 7.05-2.67 13.88-8.01 20.49-5.34 6.61-11.66 10.66-18.96 12.15-.08-1.58-.16-3.25-.16-5z"/>
            </svg>
            <span>Apple</span>
          </button>
        </div>

        <!-- Footer Sign-up link inside the card -->
        <div class="mt-6 text-center text-xs text-slate-600 font-normal">
          Don't have an account? 
          <a href="#" class="font-semibold text-[#00806F] hover:text-[#0A6C5E] hover:underline focus:outline-none transition-colors">
            Create account
          </a>
        </div>
      </section>
    </div>

  </main>
</body>
</html>
