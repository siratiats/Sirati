<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سيرتي - إدارة السير الذاتية والأدوات</title>
  <!-- Google Fonts: IBM Plex Sans Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"IBM Plex Sans Arabic"', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#0E6B5C',
              'primary-dark': '#0B3D36',
              mint: '#2BD4A8',
              bg: '#0F1A1C',
              card: '#16242A',
              border: '#23363C',
              surfaceLight: '#FFFFFF',
            }
          }
        }
      }
    }
  </script>
  <!-- Phosphor / Lucide style icons via SVG -->
  <style>
    body {
      font-family: 'IBM Plex Sans Arabic', sans-serif;
      background-color: #0F1A1C;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .check-pattern {
      background-image: radial-gradient(rgba(43, 212, 168, 0.12) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .glass-effect {
      background: rgba(22, 36, 42, 0.85);
      backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="min-h-screen bg-[#0F1A1C] text-slate-100 flex justify-center items-start antialiased pb-28">

  <!-- Mobile Container (~390px - 430px) -->
  <div class="w-full max-w-[420px] min-h-screen relative flex flex-col bg-[#0F1A1C] overflow-hidden shadow-2xl">

    <!-- Top Status Bar & Header Gradient Band -->
    <header class="relative bg-gradient-to-b from-[#0B3D36] via-[#0E6B5C] to-[#0E6B5C] pt-12 pb-16 px-5 text-white overflow-hidden rounded-b-[28px]">
      <!-- Subtle checkmark/dot texture overlay -->
      <div class="absolute inset-0 check-pattern opacity-40 pointer-events-none"></div>
      
      <!-- Ambient Glow Behind Header -->
      <div class="absolute -top-12 -right-12 w-48 h-48 bg-[#2BD4A8]/20 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Top Row: Title + Notification Bell -->
      <div class="relative z-10 flex items-center justify-between mb-3">
        <!-- Notification Bell (Round button on the left in RTL, which is left side of screen) -->
        <button type="button" aria-label="الإشعارات" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 transition-all flex items-center justify-center border border-white/15 backdrop-blur-md relative">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-[#2BD4A8] ring-2 ring-[#0B3D36]"></span>
        </button>

        <!-- Brand Title & Tagline -->
        <div class="text-right">
          <div class="flex items-center justify-end gap-2">
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-[#2BD4A8]/20 text-[#2BD4A8] border border-[#2BD4A8]/30">الذكاء الاصطناعي</span>
            <h1 class="text-2xl font-bold tracking-tight text-white">سيرتي</h1>
          </div>
        </div>
      </div>

      <!-- Subtitle -->
      <div class="relative z-10 text-right pr-0.5">
        <p class="text-emerald-100/90 text-sm leading-relaxed font-normal">
          أنشئ سيرتك، وافحصها، وأدر نسخك من مكان واحد
        </p>
      </div>
    </header>

    <!-- Main Content Container with negative margin overlap -->
    <main class="flex-1 px-4 -mt-10 relative z-20 space-y-6">

      <!-- White Rounded Card Overlapping the Header titled "الأدوات" with 2x2 Grid -->
      <section class="bg-white text-slate-800 rounded-2xl p-4 shadow-xl border border-slate-100 transition-all">
        <!-- Section Title inside the white card -->
        <div class="flex items-center justify-between mb-3.5 pb-2 border-b border-slate-100">
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-[#0E6B5C]"></div>
            <h2 class="text-base font-bold text-slate-900">الأدوات الذكية</h2>
          </div>
          <span class="text-xs text-slate-400 font-medium">٤ أدوات فعّالة</span>
        </div>

        <!-- 2x2 Grid of Tool Tiles -->
        <div class="grid grid-cols-2 gap-3">

          <!-- Tile 1: "إنشاء السيرة" (FILLED solid teal with white text - Primary Action) -->
          <button type="button" class="relative text-right bg-[#0E6B5C] hover:bg-[#0B3D36] text-white p-3.5 rounded-xl flex flex-col justify-between min-h-[148px] shadow-md shadow-[#0E6B5C]/20 transition-all active:scale-[0.98] border border-[#0E6B5C]">
            <!-- Top bar: chevron on top-left (left side in RTL) & small icon badge on top-right -->
            <div class="w-full flex items-center justify-between">
              <span class="text-emerald-200 text-sm font-semibold opacity-90">‹</span>
              <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center text-white backdrop-blur-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
              </div>
            </div>

            <!-- Bottom Content -->
            <div class="mt-3">
              <span class="inline-block text-[10px] font-bold px-1.5 py-0.5 rounded bg-[#2BD4A8] text-[#0B3D36] mb-1">الأساسي</span>
              <h3 class="text-sm font-bold text-white mb-1 leading-snug">إنشاء السيرة</h3>
              <p class="text-[11px] text-emerald-100/80 leading-snug line-clamp-2">متوافقة مع أنظمة الفرز الآلي ATS</p>
            </div>
          </button>

          <!-- Tile 2: "فحص" -->
          <button type="button" class="relative text-right bg-slate-50 hover:bg-slate-100/90 text-slate-800 p-3.5 rounded-xl flex flex-col justify-between min-h-[148px] border border-slate-200/80 transition-all active:scale-[0.98]">
            <!-- Top bar -->
            <div class="w-full flex items-center justify-between">
              <span class="text-slate-400 text-sm font-semibold">‹</span>
              <div class="w-8 h-8 rounded-lg bg-emerald-100/70 text-[#0E6B5C] flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
            </div>

            <!-- Bottom Content -->
            <div class="mt-3">
              <h3 class="text-sm font-bold text-slate-900 mb-1 leading-snug">فحص</h3>
              <p class="text-[11px] text-slate-500 leading-snug line-clamp-2">فحص السيرة بنظام (ATS)</p>
            </div>
          </button>

          <!-- Tile 3: "رفع سيرة خارجية" -->
          <button type="button" class="relative text-right bg-slate-50 hover:bg-slate-100/90 text-slate-800 p-3.5 rounded-xl flex flex-col justify-between min-h-[148px] border border-slate-200/80 transition-all active:scale-[0.98]">
            <!-- Top bar -->
            <div class="w-full flex items-center justify-between">
              <span class="text-slate-400 text-sm font-semibold">‹</span>
              <div class="w-8 h-8 rounded-lg bg-emerald-100/70 text-[#0E6B5C] flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
              </div>
            </div>

            <!-- Bottom Content -->
            <div class="mt-3">
              <h3 class="text-sm font-bold text-slate-900 mb-1 leading-snug">رفع سيرة خارجية</h3>
              <p class="text-[11px] text-slate-500 leading-snug line-clamp-2">ارفع سيرتك الذاتية PDF، وحوّلها إلى سيرة مطابقة للفرز</p>
            </div>
          </button>

          <!-- Tile 4: "استهداف وظيفة" -->
          <button type="button" class="relative text-right bg-slate-50 hover:bg-slate-100/90 text-slate-800 p-3.5 rounded-xl flex flex-col justify-between min-h-[148px] border border-slate-200/80 transition-all active:scale-[0.98]">
            <!-- Top bar -->
            <div class="w-full flex items-center justify-between">
              <span class="text-slate-400 text-sm font-semibold">‹</span>
              <div class="w-8 h-8 rounded-lg bg-emerald-100/70 text-[#0E6B5C] flex items-center justify-center">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
              </div>
            </div>

            <!-- Bottom Content -->
            <div class="mt-3">
              <h3 class="text-sm font-bold text-slate-900 mb-1 leading-snug">استهداف وظيفة</h3>
              <p class="text-[11px] text-slate-500 leading-snug line-clamp-2">إنشاء سيرة مطابقة لوصف وظيفي معين</p>
            </div>
          </button>

        </div>
      </section>

      <!-- Section Title: "سيري الذاتية" -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <div class="flex items-center gap-2">
            <h2 class="text-lg font-bold text-slate-100">سيري الذاتية</h2>
            <span class="text-xs px-2 py-0.5 rounded-full bg-[#16242A] text-slate-400 border border-[#23363C]">٠</span>
          </div>
          <span class="text-xs text-slate-400">الملفات المحفوظة</span>
        </div>

        <!-- Dark Empty-State Card -->
        <!-- Navy-teal card #16242A with 16px radius, 1px #23363C border -->
        <div class="bg-[#16242A] rounded-2xl p-6 border border-[#23363C] text-center flex flex-col items-center shadow-lg relative overflow-hidden">
          
          <!-- Subtle Glow effect inside card -->
          <div class="absolute top-0 right-1/2 translate-x-1/2 w-32 h-32 bg-[#2BD4A8]/5 rounded-full blur-2xl pointer-events-none"></div>

          <!-- Clean Line Illustration -->
          <!-- A document page with dashed outline, a teal plus badge, two small sparkle stars around it -->
          <div class="relative w-24 h-24 mb-4 flex items-center justify-center">
            
            <!-- Sparkle Star Top Right -->
            <svg class="absolute top-1 right-2 w-4 h-4 text-[#2BD4A8] animate-pulse" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
            </svg>

            <!-- Sparkle Star Bottom Left -->
            <svg class="absolute bottom-2 left-2 w-3.5 h-3.5 text-[#2BD4A8]/80" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z"/>
            </svg>

            <!-- Document Sheet with Dashed Outline -->
            <div class="w-16 h-20 rounded-xl border-2 border-dashed border-[#2BD4A8]/60 bg-[#0F1A1C]/80 flex flex-col items-center justify-center p-2 relative shadow-inner">
              <!-- Internal doc dummy lines -->
              <div class="w-8 h-1 bg-[#23363C] rounded-full mb-1.5"></div>
              <div class="w-10 h-1 bg-[#23363C] rounded-full mb-1.5"></div>
              <div class="w-6 h-1 bg-[#23363C] rounded-full"></div>

              <!-- Teal Plus Badge at bottom center of the document -->
              <div class="absolute -bottom-2.5 right-1/2 translate-x-1/2 w-6 h-6 rounded-full bg-[#0E6B5C] border-2 border-[#16242A] text-[#2BD4A8] flex items-center justify-center shadow-md">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
                </svg>
              </div>
            </div>
          </div>

          <!-- Bold Title -->
          <h3 class="text-base font-bold text-slate-100 mb-1.5">
            لا توجد سير ذاتية بعد
          </h3>

          <!-- Grey Text -->
          <p class="text-xs text-slate-400 leading-relaxed max-w-[280px] mb-6">
            أنشئ أول سيرة متوافقة مع ATS، أو ارفع سيرة خارجية لتعديلها.
          </p>

          <!-- Buttons Stack -->
          <div class="w-full space-y-2.5">
            <!-- Full-width solid teal button "أنشئ سيرتك" with chevron -->
            <button type="button" class="w-full h-12 bg-[#0E6B5C] hover:bg-[#0B3D36] text-white font-semibold text-sm rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98] shadow-md shadow-[#0E6B5C]/25 border border-[#0E6B5C]">
              <span>أنشئ سيرتك</span>
              <svg class="w-4 h-4 text-emerald-200 transform rotate-180" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
              </svg>
            </button>

            <!-- Full-width outlined teal button "ارفع سيرة خارجية" -->
            <button type="button" class="w-full h-12 bg-transparent hover:bg-[#0E6B5C]/10 text-[#2BD4A8] border border-[#2BD4A8] font-semibold text-sm rounded-xl flex items-center justify-center gap-2 transition-all active:scale-[0.98]">
              <svg class="w-4 h-4 text-[#2BD4A8]" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
              </svg>
              <span>ارفع سيرة خارجية</span>
            </button>
          </div>

        </div>
      </section>

    </main>

    <!-- Bottom Navigation Bar (Docked fixed bottom) -->
    <!-- 4 items right-to-left: الرئيسية (home), سيرتي (document, active with mint pill), الوظائف (briefcase), التعليم (graduation cap) -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-[420px] mx-auto z-40 bg-[#16242A]/95 backdrop-blur-md border-t border-[#23363C] px-3 py-2 flex items-center justify-around shadow-[0_-4px_20px_rgba(0,0,0,0.4)]">
      
      <!-- 1. الرئيسية (home) -->
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-colors">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-[11px] font-medium">الرئيسية</span>
      </button>

      <!-- 2. سيرتي (document, ACTIVE with mint pill / mint text) -->
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3.5 rounded-xl bg-[#2BD4A8]/15 border border-[#2BD4A8]/30 text-[#2BD4A8] font-semibold transition-all">
        <svg class="w-5 h-5 mb-1 text-[#2BD4A8]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
        <span class="text-[11px] font-bold text-[#2BD4A8]">سيرتي</span>
      </button>

      <!-- 3. الوظائف (briefcase) -->
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-colors">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
        <span class="text-[11px] font-medium">الوظائف</span>
      </button>

      <!-- 4. التعليم (graduation cap) -->
      <button type="button" class="flex flex-col items-center justify-center py-1 px-3 text-slate-400 hover:text-slate-200 transition-colors">
        <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l9-5-9-5-9 5 9 5z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
        </svg>
        <span class="text-[11px] font-medium">التعليم</span>
      </button>

    </nav>

  </div>

</body>
</html>
